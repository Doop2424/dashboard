<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --r:4px; --gap:12px;
  }
  body[data-theme="light"]{
    --ink:#1A2432; --ink2:#57687C; --ink3:#8C9AAA;
    --paper:#FFFFFF; --shell:#EDF0F5; --shell2:#DDE3EB;
    --rule:#CBD4DE; --rule2:#E4E9EF; --soft:#F7F9FC;
    --blue:#1D4E89; --tick:#B3272D; --ok:#1F7A5C; --amber:#9A6B12; --purple:#6B3F8C;
    --barbg:#1A2432; --bartx:#EDF1F6; --barmut:#8FA3B8; --barbd:#3B4A5C; --barhv:#26313F;
  }
  body[data-theme="dark"]{
    --ink:#E4EAF2; --ink2:#9FADBE; --ink3:#75859A;
    --paper:#1B222C; --shell:#0F141A; --shell2:#28313D;
    --rule:#3A4553; --rule2:#2B3441; --soft:#202834;
    --blue:#6FA8E8; --tick:#E4736F; --ok:#5FC29A; --amber:#D6A94E; --purple:#B48BD6;
    --barbg:#0A0E13; --bartx:#E4EAF2; --barmut:#7A8A9D; --barbd:#333E4C; --barhv:#1C242F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--shell);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  button,input{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .hide{display:none !important}

  header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
         padding:10px 22px;background:var(--barbg);color:var(--bartx);border-bottom:3px solid var(--tick)}
  header .today{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--barmut)}
  header .today b{color:var(--bartx)}
  header .sp{flex:1}
  header .who{font-size:12px;color:var(--barmut)}
  header .sync{font-family:var(--mono);font-size:10px;color:var(--barmut);letter-spacing:.06em}
  .btn{border:1px solid var(--barbd);background:transparent;color:var(--bartx);padding:6px 13px;
       border-radius:var(--r);cursor:pointer;font-size:13.5px;white-space:nowrap}
  .btn:hover{background:var(--barhv)}
  .btn.on{background:var(--tick);border-color:var(--tick);color:#fff;font-weight:600}
  .seg{display:flex;border:1px solid var(--barbd);border-radius:var(--r);overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--barmut);padding:6px 10px;cursor:pointer;font-size:12.5px}
  .seg button:hover{background:var(--barhv);color:var(--bartx)}
  .seg button.on{background:var(--bartx);color:var(--barbg);font-weight:600}

  main{padding:18px 22px 60px;max-width:1560px;margin:0 auto}

  #login{max-width:380px;margin:60px auto;background:var(--paper);border:1px solid var(--rule2);
         border-radius:var(--r);padding:26px}
  #login h2{margin:0 0 4px;font-size:20px}
  #login .hint{margin:0 0 18px;font-size:13px;color:var(--ink3)}
  #login label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
               text-transform:uppercase;color:var(--ink3);margin:12px 0 4px}
  #login input{width:100%;border:1px solid var(--rule2);border-radius:var(--r);padding:8px 10px;background:var(--soft)}
  #login .row{display:flex;gap:8px;margin-top:18px}
  #login .row button{flex:1;background:var(--blue);border:1px solid var(--blue);color:#fff;
                     border-radius:var(--r);padding:8px;cursor:pointer;font-weight:600}
  #login .msg{margin-top:12px;font-size:13px;color:var(--tick);min-height:20px}

  .editbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);
           border:1px solid var(--rule2);border-radius:var(--r);padding:9px 14px;margin-bottom:14px}
  body.edit .editbar{display:flex}
  .editbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .editbar .sp{flex:1}
  .ebtn{border:1px solid var(--rule);background:transparent;color:var(--ink2);padding:4px 11px;
        border-radius:var(--r);cursor:pointer;font-size:13px}
  .ebtn:hover{background:var(--soft);color:var(--ink)}

  #grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap);row-gap:0;
       grid-auto-rows:1px;align-items:start}
  .w{background:var(--paper);border:1px solid var(--rule2);border-radius:var(--r);
     display:flex;flex-direction:column;overflow:hidden;position:relative}
  .w > h3{margin:0;padding:10px 13px 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;
          border-bottom:1px solid var(--rule2);flex:none}
  .w > h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none}
  .w > h3 .sp{flex:1}
  .w > h3 .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.05em}
  .body{flex:1;overflow:auto;padding:11px 13px 13px}

  .kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13.5px}
  .kv b{font-weight:600}
  .li{display:flex;gap:8px;padding:4px 0;font-size:13.5px;align-items:baseline;border-bottom:1px solid var(--rule2)}
  .li:last-child{border-bottom:0}
  .li .t{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:none;min-width:44px}
  .li .x{flex:1;min-width:0}
  .big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .sub{font-size:12px;color:var(--ink3)}
  .strip{display:flex;gap:8px;align-items:center;font-size:12px;border-radius:var(--r);
         padding:6px 10px;margin-bottom:9px;background:var(--soft);border:1px solid var(--rule2);color:var(--ink2)}
  .strip b{font-weight:600;color:var(--ink)}
  .strip.work{border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
  .strip.holiday{border-color:color-mix(in srgb,var(--purple) 40%,transparent)}
  .strip.leave{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .task{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--rule2)}
  .task:last-of-type{border-bottom:0}
  .task .box{width:17px;height:17px;border:1.5px solid var(--rule);border-radius:3px;flex:none;cursor:pointer;
             display:flex;align-items:center;justify-content:center;background:var(--paper)}
  .task.done .box{background:var(--ok);border-color:var(--ok)}
  .task.done .box::after{content:"✓";color:#fff;font-size:11px;font-weight:700}
  .task .x{flex:1;min-width:0;word-break:break-word}
  .task.done .x{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--tick)}
  .task .del{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:12px;
             padding:2px 5px;border-radius:2px;opacity:.55;flex:none}
  .task .del:hover{opacity:1;background:var(--tick);color:#fff}
  .addtodo{display:flex;gap:6px;margin-top:10px}
  .addtodo input{flex:1;border:1px solid var(--rule2);border-radius:var(--r);padding:6px 9px;background:var(--soft)}
  .addtodo button{border:1px solid var(--rule);background:transparent;border-radius:var(--r);padding:6px 12px;cursor:pointer}
  .addtodo button:hover{background:var(--soft)}
  .tools{display:flex;flex-wrap:wrap;gap:8px}
  .tools a{display:block;border:1px solid var(--rule2);border-radius:var(--r);padding:8px 12px;
           text-decoration:none;color:var(--ink);background:var(--soft);font-size:13.5px}
  .tools a:hover{border-color:var(--blue);color:var(--blue)}
  .tools a span{display:block;font-size:11px;color:var(--ink3)}
  .pending{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;
           color:var(--ink3);font-size:12.5px;gap:4px;text-align:center}
  .pending .p1{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
  .empty{color:var(--ink3);font-size:13px;padding:6px 0}
  /* 팀 일정(이번 주) */
  .ts{display:flex;flex-direction:column;gap:8px;height:100%}
  .ts .tshead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
  .ts .tshead b{color:var(--ink);font-weight:600}
  .ts .tshead a{margin-left:auto;color:var(--blue);text-decoration:none;font-size:12px}
  .ts .tshead a:hover{text-decoration:underline}
  .ts table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11.5px}
  .ts th,.ts td{border:1px solid var(--rule2);height:24px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
  .ts th{font-weight:600;background:var(--soft)}
  .ts th.today{box-shadow:inset 0 -3px 0 var(--tick)}
  .ts th.nm,.ts td.nm{width:66px;text-align:left;font-weight:600}
  .ts td.nm.me{color:var(--blue)}
  .ts td.ev{font-weight:600}
  .ts td.hol{background:color-mix(in srgb,var(--purple) 18%,var(--paper));font-weight:600}
  /* 일정 계획 */
  .plhead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:8px}
  .plhead .sp{flex:1}
  .plclip{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--soft);
          border:1px solid var(--rule2);border-left:3px solid var(--tick);border-radius:var(--r);
          padding:6px 10px;margin-bottom:8px;color:var(--ink2)}
  .plgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .plgrid .dow{text-align:center;font-size:10.5px;color:var(--ink3);padding-bottom:3px}
  .plgrid .dow.sun{color:var(--tick)} .plgrid .dow.sat{color:var(--blue)}
  .pc{min-height:62px;border:1px solid var(--rule2);border-radius:3px;padding:3px;cursor:pointer;
      display:flex;flex-direction:column;gap:2px;overflow:hidden;font-size:11.5px;color:var(--ink2)}
  .pc:hover{border-color:var(--blue)}
  .pc.off{visibility:hidden;cursor:default;border:0}
  .pc b{font-weight:inherit;line-height:1.1}
  .pc.sun{color:var(--tick)} .pc.sat{color:var(--blue)}
  .pc.today{border-color:var(--tick)}
  .pc.sel{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
  .pc.inrange{background:color-mix(in srgb,var(--blue) 14%,transparent);border-color:var(--blue)}
  .pc{user-select:none}
  .pldate{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none;min-width:30px}
  .cphead{display:flex;align-items:center;gap:10px}
  .pchip{display:block;font-style:normal;font-size:9px;line-height:1.3;color:#fff;border-radius:2px;
         padding:2px 4px;overflow:hidden}
  .pchip b{display:block;font-weight:600;word-break:keep-all;overflow-wrap:anywhere;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pchip s{display:block;text-decoration:none;opacity:.8;font-size:8.5px}
  .pc{min-height:76px}
  .tooladd{border:1px dashed var(--rule);background:transparent;color:var(--ink3);border-radius:var(--r);
           padding:8px 14px;cursor:pointer;font-size:15px;line-height:1}
  .tooladd:hover{border-color:var(--blue);color:var(--blue);border-style:solid}
  .tlhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;
          color:var(--ink3);margin-bottom:8px}
  .tlrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;
         border-bottom:1px solid var(--rule2)}
  .tlname{font-weight:600;flex:none;min-width:110px}
  .tlurl{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink3);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlform{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tlform input{flex:1;min-width:120px;border:1px solid var(--rule2);border-radius:var(--r);
                padding:6px 9px;background:var(--soft)}
  .plclip .sp{flex:1}
  .pmore{font-family:var(--mono);font-size:8.5px;font-style:normal;color:var(--ink3)}
  .gchip{display:block;font-style:normal;font-size:9px;line-height:1.35;border-radius:2px;
         padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
         border:1px dashed var(--rule);color:var(--ink3)}
  .pchip.done{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
  .plrow.reg{opacity:.75}
  .regtag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ok);
          border:1px solid var(--ok);border-radius:2px;padding:1px 5px;flex:none}
  .cnav.go{border-color:var(--blue);color:var(--blue)}
  .cnav:disabled{opacity:.5;cursor:default}
  .plcfg{background:var(--soft);border:1px solid var(--rule2);border-radius:var(--r);
         padding:10px 12px;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:12px;
        padding:2px 9px;font-size:12px;background:transparent;color:var(--ink2);cursor:default}
  .chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:9px;opacity:.6;padding:0}
  .chip button:hover{opacity:1;color:var(--tick)}
  .chip.pick{cursor:pointer}
  .chip.pick:hover{border-color:var(--blue);color:var(--blue)}
  .chip.pick.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .plrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;
         border-bottom:1px solid var(--rule2)}
  .pdot{width:8px;height:8px;border-radius:2px;flex:none}
  .plname{font-weight:600;flex:none;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plwho{color:var(--blue);font-size:12px;flex:none}
  .plmemo{flex:1;min-width:0;color:var(--ink3);font-size:12px;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .plform{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule2)}
  .plform select{width:100%;border:1px solid var(--rule2);background:var(--soft);color:var(--ink);
                 border-radius:var(--r);padding:6px 9px;margin-bottom:8px}
  .ziphead{display:flex;align-items:center;justify-content:space-between;font-size:12px;
           color:var(--ink3);margin-bottom:6px}
  .zipbox{width:100%;height:calc(100% - 28px);min-height:200px;border:1px solid var(--rule2);border-radius:var(--r)}
  .zipres{margin-top:12px}
  .zipcode{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.02em;cursor:pointer}
  .zipcode:hover{color:var(--blue)}
  .zipaddr{font-size:13.5px;margin-top:4px;cursor:pointer;line-height:1.5}
  .zipaddr:hover{color:var(--blue)}
  .zipsub{font-size:11.5px;color:var(--ink3);margin-top:3px;cursor:pointer}
  .zipsub:hover{color:var(--ink2)}
  .zipres .linkish{margin-top:8px;display:inline-block}
  .srow{display:flex;gap:8px;align-items:baseline;padding:6px 0;font-size:13px;
        border-bottom:1px solid var(--rule2)}
  .srow:last-of-type{border-bottom:0}
  .srow.hit{background:color-mix(in srgb,var(--tick) 10%,transparent);border-radius:3px;padding:6px 6px}
  .sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .sprice{font-family:var(--mono);font-size:12.5px;flex:none}
  .starget{flex:none;font-size:10.5px;color:var(--ink3);min-width:96px;text-align:right}
  .srow.hit .starget{color:var(--tick);font-weight:600}
  .attr{font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:9px;letter-spacing:.04em}
  .foot{display:block;margin-top:9px;font-size:11.5px;color:var(--ink3);text-decoration:none}
  .foot:hover{color:var(--blue);text-decoration:underline}
  .linkish{border:0;background:transparent;color:var(--blue);cursor:pointer;font-size:12px;
           padding:0 2px;text-decoration:underline}
  .up{color:var(--tick);font-style:normal;font-size:11.5px}
  .dn{color:var(--blue);font-style:normal;font-size:11.5px}
  .mhead{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
         color:var(--ink3);margin:10px 0 3px;border-top:1px solid var(--rule2);padding-top:7px}

  /* 진행중인 업무 현황 */
  .prow{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--rule2)}
  .stbadge{flex:none;border:1px solid currentColor;background:transparent;border-radius:2px;
           font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 7px;cursor:pointer}
  .st-todo{color:var(--ink3)} .st-doing{color:var(--blue)}
  .st-review{color:var(--amber)} .st-done{color:var(--ok)}
  .ptitle{flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .ptitle:hover{text-decoration:underline}
  .pnote{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
         color:var(--ink3);font-size:12px;cursor:pointer}
  .pnote:hover{color:var(--ink2);text-decoration:underline}

  /* 근무시간 카운터 */
  .clock{font-family:var(--mono);font-size:64px;font-weight:700;letter-spacing:-.03em;text-align:center;
         padding:10px 0 16px;line-height:1}
  .clock span{font-size:20px;color:var(--ink3);font-weight:500;margin-left:5px;vertical-align:9px}
  .plab{border:0;background:transparent;padding:0;cursor:pointer;font-size:13.5px;color:var(--ink2);
        border-bottom:1px dashed var(--rule)}
  .plab:hover{color:var(--blue);border-bottom-color:var(--blue)}
  .plab.set{color:var(--ok);border-bottom-color:transparent}
  .ptimes .kv b{display:flex;gap:5px;align-items:center;font-family:var(--mono);font-size:12.5px}
  .ptimes .edit{cursor:pointer;border-bottom:1px dashed var(--rule)}
  .ptimes .edit:hover{color:var(--blue)}

  /* 명언 */
  .qen{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule2);
       font-size:12.5px;line-height:1.6;color:var(--ink2);font-style:italic}

  /* 스트레칭 */
  .strow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule2)}
  .strow:last-child{border-bottom:0}
  .strow.past{opacity:.42}
  .fig{width:34px;height:34px;flex:none;fill:none;stroke:var(--ink2);stroke-width:2;
       stroke-linecap:round;stroke-linejoin:round}
  .fig .acc{stroke:var(--blue)}
  .fig circle{fill:none}
  .stx{flex:1;min-width:0}
  .sthead{font-size:13px;font-weight:600}
  .sthead .t{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-right:4px}
  .stdesc{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:2px}

  /* 생활영어 */
  .erow{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule2);cursor:pointer}
  .erow:last-child{border-bottom:0}
  .erow:hover .een{color:var(--blue)}
  .erow.saying .een{color:var(--blue)}
  .enum{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none;padding-top:3px}
  .ex{flex:1;min-width:0}
  .een{font-size:13.5px;font-weight:600;line-height:1.45}
  .een .spk{font-size:9px;color:var(--ink3);margin-left:5px;font-style:normal}
  .erow.saying .spk{color:var(--blue)}
  .eko{font-size:12.5px;color:var(--ink2);margin-top:1px}
  .enote{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.5}

  /* 미니 캘린더 */
  .calhead{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;
           font-weight:600;margin-bottom:8px}
  .cnav{border:1px solid var(--rule2);background:transparent;border-radius:var(--r);
        padding:1px 8px;cursor:pointer;color:var(--ink3);font-size:12px}
  .cnav:hover{color:var(--ink);background:var(--soft)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .calgrid .dow{text-align:center;font-size:10.5px;color:var(--ink3);padding-bottom:3px}
  .cc{min-height:42px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;

  return null;
}
function minutesOf(r){
  if(!r || !r.start || !r.end) return null;
  const a = String(r.start).split(':').map(Number), b = String(r.end).split(':').map(Number);
  if(isNaN(a[0]) || isNaN(b[0])) return null;
  let m = (b[0]*60 + (b[1]||0)) - (a[0]*60 + (a[1]||0));

  return m;
}

const gcal = {token:null, exp:0, months:{}, busy:false, err:null, client:null};
// 새로고침해도 유지되도록 토큰을 탭 세션에 보관한다 (구글 토큰은 1시간짜리).
try{
  const saved = JSON.parse(sessionStorage.getItem('gcal_token') || 'null');
  if(saved && saved.exp > Date.now() + 60000){ gcal.token = saved.token; gcal.exp = saved.exp; }
}catch(e){}
function keepToken(){
  try{ sessionStorage.setItem('gcal_token', JSON.stringify({token:gcal.token, exp:gcal.exp})); }catch(e){}
}
function gcalReady(){ return !!GOOGLE_CLIENT_ID; }
function monthKey(y, m){ return `${y}-${pad(m+1)}`; }

function loadGsi(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(loadGsi._p) return loadGsi._p;
  loadGsi._p = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true; sc.onload = res; sc.onerror = () => rej(new Error('gsi'));
    document.head.appendChild(sc);
  });
  return loadGsi._p;
}
async function gcalAuth(interactive){
  if(!gcalReady()) throw new Error('no-client-id');
  if(gcal.token && Date.now() < gcal.exp - 60000) return gcal.token;
  await loadGsi();
  return new Promise((res, rej) => {
    gcal.client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.events',
      callback: (t) => {
        if(t && t.access_token){
          gcal.token = t.access_token;
          gcal.exp = Date.now() + (t.expires_in || 3600) * 1000;
          keepToken();
          res(gcal.token);
        }else rej(new Error('token'));
      },
      error_callback: () => rej(new Error('cancel'))
    });
    gcal.client.requestAccessToken({prompt: interactive ? 'consent' : ''});
  });
}
async function gcalLoadMonth(y, m, interactive){
  const key = monthKey(y, m);
  if(gcal.months[key] || gcal.busy) return;
  if(!gcalReady()) return;
  gcal.busy = true; gcal.err = null;
  refreshWidget('minical');
  try{
    const token = await gcalAuth(interactive);
    const from = new Date(y, m, 1).toISOString();
    const to = new Date(y, m+1, 1).toISOString();
    const u = `https://www.googleapis.com/calendar/v3/calendars/primary/events`
      + `?timeMin=${encodeURIComponent(from)}&timeMax=${encodeURIComponent(to)}`
      + `&singleEvents=true&orderBy=startTime&maxResults=250`;
    const r = await fetch(u, {headers:{Authorization:'Bearer ' + token}});
    if(r.status === 401){
      gcal.token = null; gcal.exp = 0; keepToken();
      throw new Error('expired');
    }
    if(!r.ok) throw new Error('http-' + r.status);
    const j = await r.json();
    const by = {};
    const dstr2 = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const monFrom = dstr2(new Date(y, m, 1));
    const monTo = dstr2(new Date(y, m+1, 0));
    (j.items || []).forEach(ev => {
      const st = ev.start || {}, en = ev.end || {};
      const allDay = !!st.date;
      const sDs = allDay ? st.date : String(st.dateTime).slice(0, 10);
      let eDs;
      if(allDay){
        // 종일 일정의 end.date 는 '다음 날'이므로 하루 빼야 실제 마지막 날이 된다.
        const d = new Date(en.date ? en.date + 'T00:00:00' : sDs + 'T00:00:00');
        if(en.date) d.setDate(d.getDate() - 1);
        eDs = dstr2(d);
      }else{
        eDs = String(en.dateTime || st.dateTime).slice(0, 10);
      }
      if(eDs < sDs) eDs = sDs;
      const cur = new Date(sDs + 'T00:00:00'), last = new Date(eDs + 'T00:00:00');
      const total = Math.min(Math.round((last - cur) / 86400000) + 1, 90);
      for(let i = 0; i < total; i++){
        const ds = dstr2(cur);
        if(ds >= monFrom && ds <= monTo){
          const time = total > 1
            ? `${i + 1}/${total}일`
            : (allDay ? '종일' : String(st.dateTime).slice(11, 16));
          (by[ds] = by[ds] || []).push({
            time, title: ev.summary || '(제목 없음)', allDay,
            span: total, idx: i + 1, link: ev.htmlLink
          });
        }
        cur.setDate(cur.getDate() + 1);
      }
    });
    gcal.months[key] = by;
  }catch(e){
    // 자동(조용한) 시도가 실패한 경우에는 오류를 띄우지 않고 연결 버튼만 보여준다.
    if(!interactive) gcal.err = null;
    else gcal.err = e.message === 'cancel' ? '연결이 취소되었습니다'
      : e.message === 'no-client-id' ? null : '구글 캘린더를 불러오지 못했습니다';
  }finally{
    gcal.busy = false;
    refreshWidget('minical');
  }
}
async function gcalInsertRange(fromDs, toDs, summary, description){
  if(!gcalReady()) throw new Error('no-client-id');
  const token = await gcalAuth(false).catch(() => gcalAuth(true));
  const ds = fromDs;
  const end = new Date((toDs || fromDs) + 'T00:00:00');
  end.setDate(end.getDate() + 1);
  const body = {
    summary,
    description: description || '',
    start: {date: ds},
    end: {date: `${end.getFullYear()}-${pad(end.getMonth()+1)}-${pad(end.getDate())}`}
  };
  const r = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: {Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  if(r.status === 401 || r.status === 403){
    gcal.token = null; gcal.exp = 0; keepToken();
    throw new Error('permission');
  }
  if(!r.ok) throw new Error('http-' + r.status);
  const j = await r.json();
  delete gcal.months[ds.slice(0, 7)];      // 해당 월 캐시를 비워 다시 불러오게
  return j.id;
}
function gcalInsert(ds, summary, description){
  return gcalInsertRange(ds, ds, summary, description);
}
function gcalOf(ds){
  const by = gcal.months[ds.slice(0, 7)];
  return (by && by[ds]) || [];
}

/* ── 주가 알림 (stock-alert 저장소 연동) ────────────────── */
const stock = {cfg:null, last:null, err:null, done:false};
async function loadStock(){
  try{
    const r = await fetch(STOCK_BASE + 'config.json?t=' + Date.now());
    if(r.ok) stock.cfg = await r.json();
  }catch(e){ stock.err = '설정을 불러오지 못했습니다'; }
  try{
    const r = await fetch(STOCK_BASE + 'latest.json?t=' + Date.now());
    if(r.ok) stock.last = await r.json();
  }catch(e){}
  stock.done = true;
  refreshWidget('stock');
}
function priceOf(code){
  const p = stock.last && stock.last.prices && stock.last.prices[code];
  return p || null;
}
function renderStock(){
  if(!stock.done) return `<div class="empty">불러오는 중…</div>`;
  if(!stock.cfg) return `<div class="empty">${esc(stock.err || '설정 파일이 없습니다.')}</div>
    <a class="foot" href="${STOCK_BASE}" target="_blank" rel="noopener">주가 알림 설정 열기</a>`;
  const rows = [];
  const push = (code, name, cond, target, unit) => {
    const p = priceOf(code);
    const cur = p ? p.price : null;
    let hit = false;
    if(cur != null) hit = cond === 'above' ? cur >= target : cur <= target;
    const chg = p && p.change != null ? p.change : null;
    rows.push(`<div class="srow${hit ? ' hit' : ''}">
      <span class="sname">${esc(name)}</span>
      <span class="sprice">${cur != null ? won(cur, unit) : '—'}
        ${chg != null ? `<i class="${chg >= 0 ? 'up' : 'dn'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</i>` : ''}</span>
      <span class="starget">${won(target, unit)} ${cond === 'above' ? '이상' : '이하'}${hit ? ' · 도달' : ''}</span>
    </div>`);
  };
  (stock.cfg.stocks || []).forEach(x => push(x.code, x.name, x.condition, x.target_price, 0));
  (stock.cfg.currencies || []).forEach(x => push(x.code, x.name, x.condition, x.target_rate, 2));
  const when = stock.last && stock.last.updated
    ? String(stock.last.updated).replace('T', ' ').slice(0, 16)
    : null;
  return (rows.length ? rows.join('') : `<div class="empty">등록된 종목이 없습니다.</div>`)
    + (stock.last
        ? `<div class="attr">${esc(when || '')} 기준</div>`
        : `<div class="sub" style="margin-top:8px">현재가는 아직 연결되지 않았습니다. 기준가만 표시합니다.</div>`)
    + `<a class="foot" href="${STOCK_BASE}" target="_blank" rel="noopener">종목·기준가 설정</a>`;
}

function dsAdd(ds, n){
  const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function rangeDays(r){
  if(!r) return [];
  const from = r.from <= r.to ? r.from : r.to;
  const to = r.from <= r.to ? r.to : r.from;
  const out = []; let cur = from;
  for(let i = 0; i < 120 && cur <= to; i++){ out.push(cur); cur = dsAdd(cur, 1); }
  return out;
}
function curRange(){
  const days = rangeDays(planRange);
  return days.length ? days : [planSel || todayStr()];
}
function syncPlanForm(){
  const pj = document.getElementById('plProj');
  if(pj) planForm.projectId = pj.value;
  const mm = document.getElementById('plMemo');
  if(mm) planForm.memo = mm.value;
}

// 이 달의 계획 중 아직 등록되지 않은 것을 모아, 같은 내용이 연속된 날짜는
// 하나의 기간 일정으로 묶어서 구글 캘린더에 등록한다.
function planBulkGroups(){
  const key = (ev) => [ev.projectId, (ev.memberIds || []).slice().sort().join(','), ev.memo || ''].join('|');
  const days = Object.keys(plan.events)
    .filter(ds => ds.slice(0, 7) === `${planY}-${pad(planM+1)}`)
    .sort();
  const buckets = {};
  days.forEach(ds => {
    (plan.events[ds] || []).forEach(ev => {
      if(ev.gcalId) return;
      (buckets[key(ev)] = buckets[key(ev)] || []).push({ds, ev});
    });
  });
  const groups = [];
  Object.values(buckets).forEach(items => {
    items.sort((a, b) => a.ds < b.ds ? -1 : 1);
    let run = [];
    const flush = () => { if(run.length) groups.push(run); run = []; };
    items.forEach(it => {
      if(!run.length){ run = [it]; return; }
      const prev = new Date(run[run.length-1].ds + 'T00:00:00');
      prev.setDate(prev.getDate() + 1);
      const next = `${prev.getFullYear()}-${pad(prev.getMonth()+1)}-${pad(prev.getDate())}`;
      if(it.ds === next) run.push(it);
      else { flush(); run = [it]; }
    });
    flush();
  });
  return groups;
}
async function planBulkRegister(){
  const groups = planBulkGroups();
  if(!groups.length){ toast('등록할 새 계획이 없습니다.'); return; }
  const total = groups.reduce((a, g) => a + g.length, 0);
  if(!confirm(`계획 ${total}건을 ${groups.length}개 일정으로 묶어 구글 캘린더에 등록할까요?`)) return;
  let ok = 0, fail = 0;
  for(const g of groups){
    const ev = g[0].ev;
    const pj = projOf(ev.projectId);
    const who = (ev.memberIds || []).map(memName).filter(Boolean).join(', ');
    const title = (pj ? pj.name : '일정') + (who ? ` (${who})` : '');
    try{
      const id = await gcalInsertRange(g[0].ds, g[g.length-1].ds, title, ev.memo || '');
      g.forEach(it => { it.ev.gcalId = id; });
      ok += g.length;
    }catch(e){
      fail += g.length;
      if(e.message === 'permission'){
        toast('쓰기 권한이 필요합니다. 캘린더 위젯에서 연결을 다시 눌러주세요.');
        break;
      }
    }
  }
  savePlan();
  delete gcal.months[`${planY}-${pad(planM+1)}`];
  await gcalLoadMonth(planY, planM, false);
  refreshWidget('planner'); refreshWidget('minical');
  toast(fail ? `${ok}건 등록, ${fail}건 실패` : `${ok}건을 등록했습니다.`);
}

function planAdd(){
  syncPlanForm();
  if(!planForm.projectId){ toast('프로젝트를 선택하세요.'); return; }
  const days = curRange();
  days.forEach(ds => {
    (plan.events[ds] = plan.events[ds] || []).push({
      id: newId(), projectId: planForm.projectId,
      memberIds: planForm.memberIds.slice(), memo: planForm.memo
    });
  });
  planForm.memo = '';
  savePlan(); refreshWidget('planner');
  if(days.length > 1) toast(`${days.length}일에 걸쳐 추가했습니다.`);
}

/* ── 우편번호 찾기 (카카오 우편번호 서비스, 키 불필요) ──── */
const zip = {open:false, result:null, recent:[], err:null};
function loadPostcode(){
  if(window.daum && window.daum.Postcode) return Promise.resolve();
  if(loadPostcode._p) return loadPostcode._p;
  loadPostcode._p = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    sc.onload = res; sc.onerror = () => rej(new Error('load'));
    document.head.appendChild(sc);
  });
  return loadPostcode._p;
}
function renderZip(){
  if(zip.open){
    return `<div class="ziphead"><span>주소를 선택하세요</span>
        <button class="cnav" id="zipClose">닫기</button></div>
      <div class="zipbox" id="zipBox"></div>`;
  }
  const r = zip.result;
  return `<div class="addtodo"><input id="zipIn" placeholder="도로명·건물명·지번 입력 후 Enter">
      <button id="zipGo">찾기</button></div>
    ${zip.err ? `<div class="sub" style="color:var(--tick);margin-top:8px">${esc(zip.err)}</div>` : ''}
    ${r ? `<div class="zipres">
        <div class="zipcode" data-copy="${esc(r.zonecode)}" title="클릭하면 복사">${esc(r.zonecode)}</div>
        <div class="zipaddr" data-copy="${esc(r.road)}" title="클릭하면 복사">${esc(r.road)}</div>
        ${r.jibun ? `<div class="zipsub" data-copy="${esc(r.jibun)}" title="클릭하면 복사">지번 ${esc(r.jibun)}</div>` : ''}
        <button class="linkish" data-copy="${esc('[' + r.zonecode + '] ' + r.road)}">우편번호+주소 한번에 복사</button>
      </div>`
      : `<div class="empty">건물명이나 도로명 일부만 넣어도 찾아줍니다.<br>예) 웅남로 618 / 선진회계법인</div>`}
    ${zip.recent.length ? `<div class="mhead">최근 조회</div>` + zip.recent.map(x =>
        `<div class="li" data-copy="${esc('[' + x.zonecode + '] ' + x.road)}" style="cursor:pointer" title="클릭하면 복사">
          <span class="t">${esc(x.zonecode)}</span><span class="x">${esc(x.road)}</span></div>`).join('') : ''}`;
}
async function openPostcode(query){
  zip.err = null; zip.open = true;
  refreshWidget('zipcode');
  const box = document.getElementById('zipBox');
  if(!box) return;
  try{
    await loadPostcode();
    new daum.Postcode({
      oncomplete: (data) => {
        const road = data.roadAddress + (data.buildingName ? ' (' + data.buildingName + ')' : '');
        zip.result = {zonecode:data.zonecode, road, jibun:data.jibunAddress || ''};
        zip.recent = [zip.result, ...zip.recent.filter(x => x.zonecode !== data.zonecode)].slice(0, 4);
        zip.open = false;
        refreshWidget('zipcode');
      },
      onresize: () => {},
      width: '100%', height: '100%'
    }).embed(box, {q: query || '', autoClose: false});

  if(ts && ts.colors && ts.colors[p]) return ts.colors[p];

  return TS_PAL[Math.abs(h) % TS_PAL.length];

  }).join('') + '</tr>').join('');
  return `<div class="ts">
    <div class="tshead"><button class="cnav" data-ts="-1">&lsaquo;</button><b>${wk[0]} ~ ${wk[6]}</b><button class="cnav" data-ts="1">&rsaquo;</button>
      ${off ? '<button class="cnav" data-ts="0">이번 주</button>' : ''}
      <a href="${SCHEDULE_URL}" target="_blank" rel="noopener">일정표 열기 · 편집 · 엑셀</a></div>
    <div style="flex:1;overflow:auto"><table><tr><th class="nm">인원</th>${wk.map((ds, i) =>
      `<th class="${ds === tstr ? 'today' : ''}">${ds.slice(5)} (${WD[i]})</th>`).join('')}</tr>${rows}</table></div></div>`;
}
grid.addEventListener('click', e => {
  const b = e.target.closest('[data-ts]'); if(!b) return;
  const v = Number(b.dataset.ts);
  localStorage.setItem('dash.tsWeek', v === 0 ? 0 : Number(localStorage.getItem('dash.tsWeek') || 0) + v);

});

const RENDER = {
  'worklog-entry': renderTodos, 'worktime': renderWorktime,
  'carryover': renderCarryover, 'week': renderWeek, 'launcher': renderLauncher,
  'projects': renderProjects, 'punch': renderPunch, 'minical': renderMinical,
  'market': renderMarket, 'weather': renderWeather, 'quote': renderQuote,
  'stretch': renderStretch, 'english': renderEnglish, 'stock': renderStock, 'zipcode': renderZip, 'planner': renderPlanner, 'teamsched': renderTeamSched
};
function renderCustom(item){
  const note = item.note || '';
  return `<textarea class="cnote" placeholder="이 위젯이 무엇을 보여줄지, 어떻게 동작하면 좋을지 적어두세요.&#10;여기 적은 내용을 그대로 만들어 드립니다.">${esc(note)}</textarea>
    <div class="cnoteview"><span class="tagnew">만들 예정</span><br>${
      note ? esc(note) : '<span class="empty">배치 편집에서 내용을 적어주세요.</span>'}</div>`;

function renderBody(id){
  if(RENDER[id]) return RENDER[id]();
  return `<div class="pending"><span class="p1">준비 중</span>
    <span>${esc((BY[id] || {}).n || id)} — 데이터 연결 예정</span></div>`;

/* ── 그리드 ───────────────────────────────────────────── */
function build(){
  grid.innerHTML = '';
  layout.forEach((item, i) => {
    const m = BY[item.id] || {n:item.id};
    const el = document.createElement('section');
    el.className = 'w';
    el.dataset.i = i;
    el.style.gridColumn = 'span ' + item.w;
    el.style.gridRow = 'span ' + (item.h + 12);
    el.style.height = item.h + 'px';
    const isCustom = item.id === 'custom';
    if(isCustom) el.dataset.custom = '1';
    const title = isCustom
      ? `<input class="cname" value="${esc(item.name || '새 위젯')}" spellcheck="false" disabled>`
      : `<span>${esc(m.n)}</span>`;
    el.innerHTML =
      `<h3><span class="grip" title="끌어서 이동">&#10287;</span><span class="dot"></span>
        ${title}<span class="sp"></span>
        <span class="meta">${item.w}&times;${item.h}</span>
        <button class="kill" title="제거">&#10005;</button></h3>
      <div class="body" data-id="${item.id}">${isCustom ? renderCustom(item) : renderBody(item.id)}</div>
      <div class="rz rz-x"></div><div class="rz rz-y"></div><div class="rz rz-xy"></div>`;
    grid.appendChild(el);
  });
  renderPicker();
}
function refreshWidget(id){
  const b = grid.querySelector(`.body[data-id="${id}"]`);
  if(b) b.innerHTML = renderBody(id);
}
function renderPicker(){
  const have = Object.fromEntries(layout.map(x => [x.id, 1]));
  const groups = {};
  visibleCat().forEach(w => (groups[w.g] = groups[w.g] || []).push(w));
  picker.innerHTML = Object.entries(groups).map(([g, ws]) =>
    `<h5>${g}</h5><div class="items">` + ws.map(w =>
      `<button data-add="${w.id}"${(have[w.id] && !w.isNew) ? ' disabled' : ''}>${esc(w.n)}</button>`)
      .join('') + `</div>`
  ).join('');
}
picker.addEventListener('click', (e) => {
  const id = e.target.dataset.add; if(!id) return;
  const m = BY[id];
  const item = {id, w:m.w, h:m.h};
  if(m.isNew){
    item.name = '새 위젯 ' + (layout.filter(x => x.id === 'custom').length + 1);
    item.note = '';
  }
  layout.push(item);
  saveLayout(); build();
  if(m.isNew){
    const el = grid.lastElementChild.querySelector('.cname');
    if(el){ el.disabled = false; el.focus(); el.select(); }
  }
});


/* ── 관리자: 기본 배치 · 공개 위젯 설정 ────────────────── */
function visibleCat(){
  return isAdmin ? CAT : CAT.filter(w => !(defaults.hidden || []).includes(w.id));
}
function renderAdmin(){
  const hidden = defaults.hidden || [];
  const groups = {};
  CAT.forEach(w => (groups[w.g] = groups[w.g] || []).push(w));
  return `<h5>새로 가입한 사람이 처음 보게 될 화면</h5>
    <div class="items">
      <button id="adSaveLayout">지금 내 배치를 기본 배치로</button>
      <button id="adSaveTools">지금 내 유틸리티 목록을 기본으로</button>
    </div>
    <div class="sub" style="margin-bottom:10px">
      ${defaults.widgets ? `기본 배치 ${defaults.widgets.length}개 위젯이 저장되어 있습니다.`
        : '아직 기본 배치가 없습니다. 저장하면 새 사용자가 그대로 보게 됩니다.'}
    </div>
    <h5>공개 위젯 — 체크를 끄면 다른 사람 목록에서 숨겨집니다</h5>
    ${Object.entries(groups).map(([g, ws]) => `<div class="mhead">${g}</div>
      <div class="items">${ws.map(w => {
        const off = hidden.includes(w.id);
        return `<button data-ad-vis="${w.id}" class="${off ? '' : 'on'}">${off ? '비공개' : '공개'} · ${esc(w.n)}</button>`;
      }).join('')}</div>`).join('')}
    <div class="items" style="margin-top:10px">
      <button id="adSaveHidden" class="on">공개 설정 저장</button>
    </div>`;
}
async function loadDefaults(){
  try{
    const snap = await getDoc(doc(db,'config','defaults'));
    if(snap.exists()){
      const d = snap.data() || {};
      defaults = {widgets: d.widgets || null, tools: d.tools || null, hidden: d.hidden || []};
    }
  }catch(e){ /* 규칙이 없으면 무시하고 기본값 사용 */ }
}
async function saveDefaults(patch){
  if(!isAdmin) return;
  try{
    await setDoc(doc(db,'config','defaults'), {...patch, updatedAt: serverTimestamp()}, {merge:true});
    toast('기본 설정을 저장했습니다.');
  }catch(e){
    toast('저장 실패 — Firestore 규칙에서 config 쓰기 권한을 확인하세요.');
  }
}

/* ── 편집 모드 ────────────────────────────────────────── */
function setEdit(v){
  editing = v;
  document.body.classList.toggle('edit', v);
  $('#bEdit').classList.toggle('on', v);
  $('#bEdit').textContent = v ? '편집 중' : '배치 편집';
  grid.querySelectorAll('.cname').forEach(i => { i.disabled = !v; });
  if(!v) picker.classList.remove('open');
}
// 직접 정의 위젯의 제목·내용 편집 (재렌더 없이 상태만 갱신)
grid.addEventListener('input', (e) => {
  const el = e.target.closest('.w'); if(!el) return;
  const item = layout[+el.dataset.i]; if(!item || item.id !== 'custom') return;
  if(e.target.classList.contains('cname')) item.name = e.target.value;
  else if(e.target.classList.contains('cnote')) item.note = e.target.value;
  else return;
  saveLayout();
});
$('#bEdit').onclick = () => setEdit(!editing);
$('#bDone').onclick = () => { setEdit(false); toast('배치를 저장했습니다.'); };
$('#bAdd').onclick = () => picker.classList.toggle('open');
$('#bAdmin').onclick = () => {
  adminOpen = !adminOpen;
  const el = $('#admin');
  el.innerHTML = adminOpen ? renderAdmin() : '';
  el.classList.toggle('open', adminOpen);
};
$('#admin').addEventListener('click', (e) => {
  if(e.target.id === 'adSaveLayout'){
    defaults.widgets = JSON.parse(JSON.stringify(layout));
    saveDefaults({widgets: defaults.widgets});
    $('#admin').innerHTML = renderAdmin(); return;
  }
  if(e.target.id === 'adSaveTools'){
    defaults.tools = JSON.parse(JSON.stringify(tools));
    saveDefaults({tools: defaults.tools});
    return;
  }
  if(e.target.dataset.adVis){
    const id = e.target.dataset.adVis;
    const h = new Set(defaults.hidden || []);
    if(h.has(id)) h.delete(id); else h.add(id);
    defaults.hidden = [...h];
    $('#admin').innerHTML = renderAdmin(); return;
  }
  if(e.target.id === 'adSaveHidden'){
    saveDefaults({hidden: defaults.hidden || []});
    renderPicker(); return;
  }
});
function layoutText(){
  return JSON.stringify({version:3, theme, widgets:layout}, null, 1);
}
$('#bCopy').onclick = async () => {
  const t = layoutText();
  try{
    await navigator.clipboard.writeText(t);
    toast('배치를 복사했습니다. 대화창에 붙여넣으세요.');

/* ── 할일 상호작용 ────────────────────────────────────── */
function addTodo(){
  const inp = document.getElementById('todoIn'); if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  const ds = todayStr();
  ensure(ds).todos.push({id:newId(), text, done:false, createdAt:Date.now()});
  saveTodos(ds);
  refreshWidget('worklog-entry');
  refreshWidget('week');
  const again = document.getElementById('todoIn'); if(again) again.focus();
}
grid.addEventListener('click', (e) => {
  if(e.target.classList.contains('kill')){
    const el = e.target.closest('.w');
    layout.splice(+el.dataset.i, 1);
    saveLayout(); build();
    return;
  }
  if(editing) return;
  if(e.target.id === 'todoAdd'){ addTodo(); return; }
  if(e.target.id === 'projAdd'){ addProject(); return; }
  // ── 유틸리티 런처 관리 ──
  if(e.target.id === 'tlEdit'){ toolsEdit = true; refreshWidget('launcher'); return; }
  if(e.target.id === 'tlDone'){ toolsEdit = false; refreshWidget('launcher'); return; }
  if(e.target.id === 'tlAdd'){
    const n = (document.getElementById('tlName') || {}).value || '';
    const d2 = (document.getElementById('tlDesc') || {}).value || '';
    let u = (document.getElementById('tlUrl') || {}).value || '';
    u = u.trim();
    if(!n.trim() || !u){ toast('이름과 주소를 입력하세요.'); return; }
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    tools.push({n:n.trim(), d:d2.trim(), href:u});
    saveLayout(); refreshWidget('launcher'); return;
  }
  if(e.target.dataset.tlDel){
    const i = +e.target.dataset.tlDel;
    if(!confirm(`"${tools[i].n}" 을(를) 목록에서 지울까요?`)) return;
    tools.splice(i, 1); saveLayout(); refreshWidget('launcher'); return;
  }
  if(e.target.dataset.tlUp){
    const i = +e.target.dataset.tlUp;
    if(i > 0){ const t = tools[i]; tools[i] = tools[i-1]; tools[i-1] = t; saveLayout(); refreshWidget('launcher'); }
    return;
  }
  // ── 일정 계획 ──
  if(e.target.dataset.plNav != null){
    const n = +e.target.dataset.plNav;
    if(n === 0){ const t = new Date(); planY = t.getFullYear(); planM = t.getMonth(); planSel = todayStr(); }
    else { planM += n; if(planM < 0){ planM = 11; planY -= 1; } if(planM > 11){ planM = 0; planY += 1; } }
    refreshWidget('planner');
    if(gcalReady()) gcalLoadMonth(planY, planM, false).then(() => refreshWidget('planner'));
    return;
  }
  if(e.target.id === 'plBulk'){ planBulkRegister(); return; }
  if(e.target.id === 'plClearMonth'){
    const mk = `${planY}-${pad(planM+1)}`;
    const n = Object.keys(plan.events).filter(ds => ds.slice(0,7) === mk)
      .reduce((a, ds) => a + plan.events[ds].length, 0);
    if(!n){ toast('이 달에 잡아둔 계획이 없습니다.'); return; }
    if(!confirm(`${planY}년 ${planM+1}월 계획 ${n}건을 지울까요? 되돌릴 수 없습니다.`)) return;
    Object.keys(plan.events).forEach(ds => { if(ds.slice(0,7) === mk) delete plan.events[ds]; });
    planClip = null;
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.id === 'plClearAll'){
    const n = Object.values(plan.events).reduce((a, v) => a + v.length, 0);
    if(!n){ toast('잡아둔 계획이 없습니다.'); return; }
    if(!confirm(`전체 계획 ${n}건을 모두 지울까요? 되돌릴 수 없습니다.`)) return;
    if(!confirm('정말 전부 지웁니다. 계속할까요?')) return;
    plan.events = {}; planClip = null;
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.id === 'plCfg'){ planCfg = !planCfg; refreshWidget('planner'); return; }
  if(e.target.id === 'plClipOff'){ planClip = null; refreshWidget('planner'); return; }
  if(e.target.id === 'plProjAdd'){
    const el = document.getElementById('plProjIn'); const v = el ? el.value.trim() : '';
    if(!v) return;
    plan.projects.push({id:newId(), name:v, color:PAL[plan.projects.length % PAL.length]});
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.id === 'plMemAdd'){
    const el = document.getElementById('plMemIn'); const v = el ? el.value.trim() : '';
    if(!v) return;
    plan.members.push({id:newId(), name:v});
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.dataset.plProjdel){
    if(!confirm('이 프로젝트를 지울까요? 이미 잡아둔 일정은 남습니다.')) return;
    plan.projects = plan.projects.filter(x => x.id !== e.target.dataset.plProjdel);
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.dataset.plMemdel){
    plan.members = plan.members.filter(x => x.id !== e.target.dataset.plMemdel);
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.dataset.plMem){
    syncPlanForm();
    const id = e.target.dataset.plMem;
    planForm.memberIds = planForm.memberIds.includes(id)
      ? planForm.memberIds.filter(x => x !== id) : planForm.memberIds.concat(id);
    refreshWidget('planner'); return;
  }
  if(e.target.id === 'plAdd'){ planAdd(); return; }
  if(e.target.dataset.plGcal){
    const sel = planSel || todayStr();
    const ev = evOf(sel).find(x => x.id === e.target.dataset.plGcal);
    if(!ev) return;
    const pj = projOf(ev.projectId);
    const who = (ev.memberIds || []).map(memName).filter(Boolean).join(', ');
    const title = (pj ? pj.name : '일정') + (who ? ` (${who})` : '');
    const btn = e.target;
    btn.disabled = true; btn.textContent = '등록 중…';
    gcalInsert(sel, title, ev.memo || '')
      .then(id => {
        ev.gcalId = id;
        savePlan();
        toast('구글 캘린더에 등록했습니다.');
        return gcalLoadMonth(planY, planM, false);
      })
      .then(() => { refreshWidget('planner'); refreshWidget('minical'); })
      .catch(err => {
        btn.disabled = false; btn.textContent = '구글 등록';
        toast(err.message === 'permission'
          ? '쓰기 권한이 필요합니다. 캘린더 위젯에서 연결을 다시 눌러주세요.'
          : '등록 실패: ' + err.message);
      });
    return;
  }
  if(e.target.dataset.plCopy){
    const sel = planSel || todayStr();
    const ev = evOf(sel).find(x => x.id === e.target.dataset.plCopy);
    if(ev){ planClip = {projectId:ev.projectId, memberIds:(ev.memberIds||[]).slice(), memo:ev.memo || ''};
      toast('복사했습니다. 붙여넣을 날짜를 누르세요.'); refreshWidget('planner'); }
    return;
  }
  if(e.target.dataset.plDel){
    const sel = planSel || todayStr();
    plan.events[sel] = evOf(sel).filter(x => x.id !== e.target.dataset.plDel);
    if(!plan.events[sel].length) delete plan.events[sel];
    savePlan(); refreshWidget('planner'); return;
  }
  if(e.target.id === 'plRangeOff'){
    planRange = null; refreshWidget('planner'); return;
  }
  if(e.target.closest('[data-pl-day]')) return;   // 날짜는 아래 드래그 처리에서 담당
  if(e.target.id === 'zipGo'){
    const v = (document.getElementById('zipIn') || {}).value || '';
    openPostcode(v.trim()); return;
  }
  if(e.target.id === 'zipClose'){ zip.open = false; refreshWidget('zipcode'); return; }
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const t = cp.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(() => toast('복사했습니다: ' + t))
      .catch(() => { prompt('아래를 복사하세요', t); });
    return;
  }
  if(e.target.id === 'projPurge'){
    if(!confirm('완료된 업무를 목록에서 지울까요?')) return;
    projects = projects.filter(p => p.status !== 'done');
    saveProjects(); refreshWidget('projects'); return;
  }
  // 진행중인 업무 현황
  const pact = e.target.dataset.pact;
  if(pact){
    const row = e.target.closest('.prow'); if(!row) return;
    const p = projects.find(x => x.id === row.dataset.pid); if(!p) return;
    if(pact === 'cycle'){
      const i = STATUS.findIndex(s => s.k === (p.status || 'todo'));
      p.status = STATUS[(i + 1) % STATUS.length].k;
    }else if(pact === 'rename'){
      const v = prompt('업무명', p.title); if(v === null) return;
      if(!v.trim()) return; p.title = v.trim();
    }else if(pact === 'note'){
      const v = prompt('메모 (진행 상황 등)', p.note || ''); if(v === null) return;
      p.note = v.trim();
    }else if(pact === 'del'){
      if(!confirm('이 업무를 지울까요?')) return;
      projects = projects.filter(x => x.id !== p.id);
    }
    p.updatedAt = Date.now();
    saveProjects(); refreshWidget('projects'); return;
  }
  // 근무시간 카운터
  const ds = todayStr();
  if(e.target.dataset.punch){
    const k = e.target.dataset.punch, r = ensure(ds);
    const now = new Date();
    const cur = pad(now.getHours()) + ':' + pad(now.getMinutes());
    if(r[k] && !confirm(`이미 ${r[k]} 로 찍혀 있습니다. ${cur} 로 바꿀까요?`)) return;
    r[k] = cur;
    savePunch(ds); refreshWidget('punch'); refreshWidget('worklog-entry'); return;
  }
  if(e.target.dataset.edit){
    const k = e.target.dataset.edit, r = ensure(ds);
    const v = prompt('시각을 HH:MM 으로 입력하세요', r[k] || '');
    if(v === null) return;
    if(!/^\d{1,2}:\d{2}$/.test(v.trim())){ toast('HH:MM 형식으로 입력하세요'); return; }
    const p2 = v.trim().split(':');
    r[k] = pad(+p2[0]) + ':' + pad(+p2[1]);
    savePunch(ds); refreshWidget('punch'); refreshWidget('worklog-entry'); return;
  }
  if(e.target.dataset.clear){
    const k = e.target.dataset.clear, r = ensure(ds);
    if(!confirm(`${k === 'start' ? '출근' : '퇴근'} 기록을 지울까요?`)) return;
    delete r[k];
    savePunch(ds); refreshWidget('punch'); refreshWidget('worklog-entry'); return;
  }
  // 미니 캘린더
  if(e.target.dataset.calNav){
    const n = +e.target.dataset.calNav;
    if(n === 0){ const t = new Date(); calY = t.getFullYear(); calM = t.getMonth(); calSel = todayStr(); }
    else{
      calM += n;
      if(calM < 0){ calM = 11; calY -= 1; }
      if(calM > 11){ calM = 0; calY += 1; }
    }
    refreshWidget('minical');
    gcalLoadMonth(calY, calM, false);
    return;
  }
  if(e.target.dataset.gcal){
    if(e.target.dataset.gcal === 'reload') delete gcal.months[monthKey(calY, calM)];
    gcalLoadMonth(calY, calM, true);
    return;
  }
  const calCell = e.target.closest('[data-cal]');
  if(calCell){
    calSel = calCell.dataset.cal;
    refreshWidget('minical'); return;
  }
  const sayRow = e.target.closest('[data-say]');
  if(sayRow){
    const text = sayRow.dataset.say;
    if(!('speechSynthesis' in window)){ toast('이 브라우저는 음성 재생을 지원하지 않습니다.'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.92;
    const v = speechSynthesis.getVoices().find(v => /^en(-|_)US/i.test(v.lang))
           || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
    sayRow.classList.add('saying');
    u.onend = () => sayRow.classList.remove('saying');
    return;
  }
  const act = e.target.dataset.act;
  if(!act) return;
  const row = e.target.closest('.task'); if(!row) return;
  const id = row.dataset.id;
  const list = ensure(ds).todos;
  if(act === 'toggle'){
    const t = list.find(x => x.id === id);
    if(t) t.done = !t.done;
  }else if(act === 'del'){
    records[ds].todos = list.filter(x => x.id !== id);
  }
  saveTodos(ds);
  refreshWidget('worklog-entry');
  refreshWidget('week');
});
function addProject(){
  const inp = document.getElementById('projIn'); if(!inp) return;
  const title = inp.value.trim(); if(!title) return;
  projects.push({id:newId(), title, status:'doing', note:'', createdAt:Date.now(), updatedAt:Date.now()});
  saveProjects(); refreshWidget('projects');
  const again = document.getElementById('projIn'); if(again) again.focus();
}
grid.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'todoIn'){ e.preventDefault(); addTodo(); }
  if(e.target.id === 'projIn'){ e.preventDefault(); addProject(); }
  if(e.target.id === 'zipIn'){ e.preventDefault(); openPostcode(e.target.value.trim()); }
  if(e.target.id === 'plMemo'){ e.preventDefault(); planAdd(); }
  if(e.target.id === 'tlUrl'){ e.preventDefault(); document.getElementById('tlAdd').click(); }
  if(e.target.id === 'plProjIn'){ e.preventDefault(); document.getElementById('plProjAdd').click(); }
  if(e.target.id === 'plMemIn'){ e.preventDefault(); document.getElementById('plMemAdd').click(); }
});


/* ── 일정 계획: 날짜를 끌어 구간 선택 ─────────────────── */
function paintRange(){
  const days = rangeDays(planRange);
  const set = days.length > 1 ? new Set(days) : new Set();
  grid.querySelectorAll('[data-pl-day]').forEach(el => {
    el.classList.toggle('inrange', set.has(el.dataset.plDay));
  });
}
grid.addEventListener('pointerdown', (e) => {
  if(editing) return;
  const cell = e.target.closest('[data-pl-day]');
  if(!cell) return;
  e.preventDefault();
  syncPlanForm();
  planDrag = {from: cell.dataset.plDay, to: cell.dataset.plDay};
  planRange = {from: planDrag.from, to: planDrag.to};
  paintRange();
});
grid.addEventListener('pointermove', (e) => {
  if(!planDrag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest ? el.closest('[data-pl-day]') : null;
  if(cell && cell.dataset.plDay !== planDrag.to){
    planDrag.to = cell.dataset.plDay;
    planRange = {from: planDrag.from, to: planDrag.to};
    paintRange();
  }
});
document.addEventListener('pointerup', () => {
  if(!planDrag) return;
  planDrag = null;
  const days = rangeDays(planRange);
  planSel = days[0];
  if(days.length === 1) planRange = null;
  if(planClip){
    days.forEach(ds => {
      (plan.events[ds] = plan.events[ds] || []).push({
        id:newId(), projectId:planClip.projectId,
        memberIds:planClip.memberIds.slice(), memo:planClip.memo
      });
    });
    savePlan();
    if(days.length > 1) toast(`${days.length}일에 붙여넣었습니다.`);
  }
  refreshWidget('planner');
});

/* ── 드래그 이동 ──────────────────────────────────────── */
let dragI = null;
grid.addEventListener('mousedown', (e) => {
  if(!editing) return;
  if(e.target.classList.contains('grip')){
    const el = e.target.closest('.w'); if(el) el.draggable = true;
  }
});
grid.addEventListener('dragstart', (e) => {
  const el = e.target.closest('.w'); if(!el || !el.draggable) return;
  dragI = +el.dataset.i; el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(dragI)); }catch(err){}
});
grid.addEventListener('dragend', () => {
  dragI = null;
  [...grid.children].forEach(x => { x.draggable = false;
    x.classList.remove('dragging','dropbefore','dropafter'); });
});
grid.addEventListener('dragover', (e) => {
  if(dragI === null) return;
  const el = e.target.closest('.w'); if(!el) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  const after = (e.clientX - r.left) > r.width / 2;
  [...grid.children].forEach(x => x.classList.remove('dropbefore','dropafter'));
  el.classList.add(after ? 'dropafter' : 'dropbefore');
});
grid.addEventListener('drop', (e) => {
  if(dragI === null) return;
  const el = e.target.closest('.w'); if(!el) return;
  e.preventDefault();
  let to = +el.dataset.i;
  const r = el.getBoundingClientRect();
  if((e.clientX - r.left) > r.width / 2) to += 1;
  const item = layout[dragI];
  layout.splice(dragI, 1);
  if(to > dragI) to -= 1;
  layout.splice(Math.max(0, Math.min(layout.length, to)), 0, item);
  dragI = null; saveLayout(); build();
});

/* ── 크기 조절 ────────────────────────────────────────── */
let rz = null;
grid.addEventListener('pointerdown', (e) => {
  if(!editing) return;
  const h = e.target.closest('.rz'); if(!h) return;
  const el = e.target.closest('.w'), i = +el.dataset.i;
  e.preventDefault();
  const gw = grid.getBoundingClientRect().width;
  rz = {i, el, x:e.clientX, y:e.clientY, w:layout[i].w, h:layout[i].h,
        col:(gw + 12) / 12,
        axis: h.classList.contains('rz-x') ? 'x' : h.classList.contains('rz-y') ? 'y' : 'xy'};
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
});
grid.addEventListener('pointermove', (e) => {
  if(!rz) return;
  const it = layout[rz.i];
  if(rz.axis !== 'y'){
    const w = Math.max(2, Math.min(12, Math.round(rz.w + (e.clientX - rz.x) / rz.col)));
    if(w !== it.w){ it.w = w; rz.el.style.gridColumn = 'span ' + w; }
  }
  if(rz.axis !== 'x'){
    const hh = Math.max(110, Math.min(700, Math.round((rz.h + (e.clientY - rz.y)) / 10) * 10));
    if(hh !== it.h){ it.h = hh; rz.el.style.height = hh + 'px';
      rz.el.style.gridRow = 'span ' + (hh + 12); }
  }
  const m = rz.el.querySelector('.meta');
  if(m) m.innerHTML = it.w + '&times;' + it.h;
});
function endRz(){ if(rz){ rz = null; saveLayout(); } }
grid.addEventListener('pointerup', endRz);
grid.addEventListener('pointercancel', endRz);

/* ── 로그인 ───────────────────────────────────────────── */
const MSG = {
  'auth/invalid-credential':'이메일 또는 비밀번호가 틀렸어요',
  'auth/wrong-password':'비밀번호가 틀렸어요',
  'auth/user-not-found':'가입되지 않은 이메일이에요',
  'auth/invalid-email':'이메일 형식이 올바르지 않아요',
  'auth/too-many-requests':'시도가 많아 잠시 잠겼습니다',
  'auth/network-request-failed':'네트워크 오류 — 인터넷 연결을 확인해주세요',
  'auth/email-already-in-use':'이미 가입된 이메일입니다 — 로그인을 눌러주세요',
  'auth/weak-password':'비밀번호는 6자 이상이어야 합니다',
  'auth/operation-not-allowed':'Firebase 콘솔에서 이메일/비밀번호 로그인을 켜야 합니다'
};
async function login(){
  const em = $('#em').value.trim(), pw = $('#pw').value;
  if(!em || !pw){ $('#msg').textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  $('#msg').textContent = '';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, em, pw);
  }catch(e){ $('#msg').textContent = MSG[e.code] || ('오류: ' + e.code); }
}
async function signup(){
  const em = $('#em').value.trim(), pw = $('#pw').value;
  if(!em || !pw){ $('#msg').textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  if(pw.length < 6){ $('#msg').textContent = '비밀번호는 6자 이상이어야 합니다.'; return; }
  if(SIGNUP_DOMAINS.length &&
     !SIGNUP_DOMAINS.some(d => em.toLowerCase().endsWith(d.toLowerCase()))){
    $('#msg').textContent = `${SIGNUP_DOMAINS.join(', ')} 계정만 가입할 수 있습니다.`; return;
  }
  $('#msg').textContent = '';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await createUserWithEmailAndPassword(auth, em, pw);
    toast('가입 완료 — 바로 시작합니다.');
  }catch(e){ $('#msg').textContent = MSG[e.code] || ('오류: ' + e.code); }
}
$('#bIn').onclick = login;
$('#bUp').onclick = signup;
$('#pw').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
$('#em').addEventListener('keydown', e => { if(e.key === 'Enter') $('#pw').focus(); });
$('#bOut').onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if(!user){
    uid = null; records = {};
    $('#login').classList.remove('hide');
    $('#app').classList.add('hide');
    $('#bEdit').classList.add('hide');
    $('#bOut').classList.add('hide');
    $('#who').textContent = ''; setSync('');
    isAdmin = false; adminOpen = false;
    if(tsUnsub){ tsUnsub(); tsUnsub = null; ts = null; }
    $('#bAdmin').classList.add('hide');
    $('#admin').innerHTML = ''; $('#admin').classList.remove('open');
    setEdit(false);
    return;
  }
  uid = user.uid;
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#bEdit').classList.remove('hide');
  $('#bOut').classList.remove('hide');
  $('#who').textContent = user.email;
  setSync('불러오는 중…');
  let data = {};
  try{
    const snap = await getDoc(doc(db,'worklogs',uid));
    data = snap.exists() ? snap.data() : {};
    setSync('동기화됨 ✓');
  }catch(e){ setSync('불러오기 실패 — 오프라인?'); }
  records = data.records || {};
  projects = Array.isArray(data.projects) ? data.projects : [];
  const pl = data.planner || {};
  plan = {projects: pl.projects || [], members: pl.members || [], events: pl.events || {}};
  const d = data.dashboard;
  isAdmin = ADMIN_EMAILS.some(a => a.toLowerCase() === (user.email || '').toLowerCase());
  $('#bAdmin').classList.toggle('hide', !isAdmin);
  await loadDefaults();

  // 저장된 개인 설정이 없으면 관리자가 정해둔 기본값으로 시작한다.
  if(!(d && Array.isArray(d.tools) && d.tools.length) && defaults.tools) tools = JSON.parse(JSON.stringify(defaults.tools));
  if(!(d && Array.isArray(d.widgets) && d.widgets.length) && defaults.widgets){
    layout = JSON.parse(JSON.stringify(defaults.widgets));
  }
  if(d && Array.isArray(d.tools) && d.tools.length) tools = d.tools;
  if(d && Array.isArray(d.widgets) && d.widgets.length){
    const mg = migrate(d.widgets);
    layout = mg.list;
    if(mg.changed) saveLayout();
  }
  if(d && d.theme){ theme = d.theme; applyTheme(); }
  if(!isAdmin && (defaults.hidden || []).length){
    layout = layout.filter(w => !defaults.hidden.includes(w.id));
  }
  build();
  loadTeamSched();
  loadMarket();
  loadWeather();
  loadStock();
  if(gcalReady()) gcalLoadMonth(calY, calM, false).then(() => refreshWidget('planner'));
  clearInterval(window.__clock);
  window.__clock = setInterval(() => {
    const el = document.getElementById('punchClock');
    if(!el) return;
    const n = new Date();
    el.innerHTML = `${pad(n.getHours())}:${pad(n.getMinutes())}<span>:${pad(n.getSeconds())}</span>`;
  }, 1000);
});

/* ── 시작 ─────────────────────────────────────────────── */
const now = new Date();
const wd = ['일','월','화','수','목','금','토'][now.getDay()];
$('#today').innerHTML =
  `<b>Dashboard</b> &nbsp; ${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${wd})`;
// 지연 저장(배치·할일·근무시간)이 남아 있는 채로 화면을 떠나지 않도록 즉시 밀어낸다.
function flushPending(){
  if(!uid) return;
  if(layoutTimer){ clearTimeout(layoutTimer); layoutTimer = null;
    setDoc(doc(db,'worklogs',uid), { dashboard:{version:3, theme, widgets:layout, tools} }, { merge:true }).catch(() => {}); }
  if(todoTimer){ clearTimeout(todoTimer); todoTimer = null;
    const ds = todayStr();
    setDoc(doc(db,'worklogs',uid), { records:{ [ds]:{ todos: todosOf(ds) } } }, { merge:true }).catch(() => {}); }
  if(projTimer){ clearTimeout(projTimer); projTimer = null;
    setDoc(doc(db,'worklogs',uid), { projects }, { merge:true }).catch(() => {}); }
}
document.addEventListener('visibilitychange', () => { if(document.hidden) flushPending(); });
window.addEventListener('pagehide', flushPending);

applyTheme();
</script>
